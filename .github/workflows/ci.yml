name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      CI: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt

      - name: Install sbt
        uses: sbt/setup-sbt@v1

      - name: Start the app
        run: |
          sbt app/run > app.log 2>&1 &

          echo "Waiting for app to start..."

          until curl --silent --output /dev/null http://localhost:9000/; do
            sleep 1
          done

          echo "App is ready"

      - name: Run tests
        run: sbt tests/test

      - name: Show app logs
        if: failure()
        run: cat app.log