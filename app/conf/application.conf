# Local development secret only — never reuse this in a real deployment.
play.http.secret.key = "local-dev-only-secret-do-not-reuse-in-production-9f3a1c"

play.i18n.langs = ["en"]

# CSRF protection is intentionally switched off. This is a stand-in
# service built purely as a stable Selenium target for a QA testing
# exercise, not a real transactional service — keeping form submission
# simple avoids token-handling noise in the automated tests. A real
# GOV.UK service must not do this.
play.filters.disabled += "play.filters.csrf.CSRFFilter"
